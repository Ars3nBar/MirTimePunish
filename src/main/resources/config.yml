chat-filter:
  enabled: true
  max-warnings: 3
  mute-duration: "15m"
  mute-reason: "Пункт 3.7 - Чрезмерная нецензурная лексика / запрещённые слова (Авто-фильтр)"
  # Умная очистка символов и замена похожих латинских букв на кириллицу (например: cука -> сука)
  smart-normalize: true
  # Слова-исключения, которые фильтр НЕ будет блокировать
  whitelist:
    - "оскорбление"
    - "команда"
    - "ребенок"
    - "хлеб"
    - "скипидар"
  # Список запрещённых корней/слов и доменов (поддерживает частичное совпадение)
  words:
    - "бля"
    - "сука"
    - "сучк"
    - "хуй"
    - "хуе"
    - "хуя"
    - "пизд"
    - "еба"
    - "ебл"
    - "ёб"
    - "мудак"
    - "мудил"
    - "пидор"
    - "пидар"
