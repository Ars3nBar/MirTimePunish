name: MirTimePunish
version: '1.1.0'
main: ru.mirtime.punish.MirTimePunish
api-version: '1.21'
softdepend:
  - PlaceholderAPI
  - LuckPerms
commands:
  punish:
    description: Меню наказаний
    permission: mirtime.punish.menu
    aliases: [p, наказание]
  check:
    description: Вызвать игрока на проверку читов
    permission: mirtime.punish.check
    aliases: [проверка]
  report:
    description: Отправить жалобу на игрока
    aliases: [rep, репорт]
  reports:
    description: Панель активных жалоб и детектов античита
    permission: mirtime.punish.reports
    aliases: [репорты]
  spec:
    description: Скрытая слежка за игроком
    permission: mirtime.punish.spec
  ban:
    description: Забанить игрока
    permission: mirtime.punish.ban
  mute:
    description: Замутить игрока
    permission: mirtime.punish.mute
  unban:
    description: Разбанить игрока
    permission: mirtime.punish.unban
  unmute:
    description: Размутить игрока
    permission: mirtime.punish.unmute
  acreport:
    description: Внутренняя команда для связки с античитом MT-AC
    permission: mirtime.punish.acreport
permissions:
  mirtime.punish.bypass:
    description: Иммунитет от наказаний и проверок
    default: op
  mirtime.punish.reload:
    description: Перезагрузка конфига
    default: op
  mirtime.punish.filter.bypass:
    description: Обход авто-фильтра чата
    default: op
