name: MirTimePunish
version: '2.1.0'
main: ru.mirtime.punish.MirTimePunish
api-version: '1.21'
softdepend:
  - LuckPerms
  - PlaceholderAPI
  - MirTimeAC

commands:
  punish:
    description: Меню наказаний по правилам MirTime
    aliases: [p, наказать]
    permission: mirtime.punish.menu
  check:
    description: Вызвать игрока на проверку читов в отдельный мир
    aliases: [проверка]
    permission: mirtime.punish.check
  checktime:
    description: Добавить время проверки (максимум 25 минут суммарно)
    aliases: [ct, времяпроверки]
    permission: mirtime.punish.check
  report:
    description: Пожаловаться на игрока
    aliases: [репорт, жалоба]
  reports:
    description: Панель жалоб, слежки и проверок
    aliases: [mod, жалобы]
    permission: mirtime.punish.reports
  spec:
    description: Скрытая слежка за игроком
    aliases: [слежка]
    permission: mirtime.punish.spec
  ban:
    description: Забанить игрока
    permission: mirtime.punish.ban
  mute:
    description: Замутить игрока
    permission: mirtime.punish.mute
  unban:
    description: Разбанить игрока
    permission: mirtime.punish.unban
  unmute:
    description: Размутить игрока
    permission: mirtime.punish.unmute
  acreport:
    description: Системный приём репортов от античита MT-AC
    permission: mirtime.punish.acreport
  os:
    description: Выбрать платформу и ОС для статистики
    aliases: [platform, ос]

permissions:
  mirtime.punish.*:
    description: Полный доступ ко всем функциям модерации
    children:
      mirtime.punish.menu: true
      mirtime.punish.check: true
      mirtime.punish.reports: true
      mirtime.punish.spec: true
      mirtime.punish.ban: true
      mirtime.punish.mute: true
      mirtime.punish.unban: true
      mirtime.punish.unmute: true
      mirtime.punish.reload: true
      mirtime.punish.filter.bypass: true
      mirtime.punish.acreport: true
